# miraflores-shop.com — wipe cutover (Nest + Next Admin + Vite Front)
# SSL как на текущем VPS: /etc/nginx/ssl/miraflores-shop.com/

upstream miraflores_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Соцсети + поисковики без полноценного JS — HTML с title/description/canonical из Nest.
map $http_user_agent $seo_bot_prerender {
    default 0;
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*Twitterbot 1;
    ~*TelegramBot 1;
    ~*WhatsApp 1;
    ~*vkShare 1;
    ~*VKBot 1;
    ~*Slackbot 1;
    ~*LinkedInBot 1;
    ~*Pinterest 1;
    ~*Discordbot 1;
    ~*Googlebot 1;
    ~*Google-InspectionTool 1;
    ~*AdsBot-Google 1;
    ~*Mediapartners-Google 1;
    ~*YandexBot 1;
    ~*YandexAccessibilityBot 1;
}

upstream miraflores_admin {
    server 127.0.0.1:3010;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name miraflores-shop.com www.miraflores-shop.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miraflores-shop.com www.miraflores-shop.com;

    # Видео в отзывах/каталоге — до 80 МБ (Nest multer); запас под multipart-обёртку
    client_max_body_size 100m;

    ssl_certificate     /etc/nginx/ssl/miraflores-shop.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/miraflores-shop.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/miraflores_access.log;
    error_log  /var/log/nginx/miraflores_error.log;

    # JSON PLP/catalog — gzip + proxy buffers (HTTP/2 clients hung ~16KB without full buffer)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    # SEO: robots.txt и sitemap.xml из Nest (не из Vite root)
    location = /robots.txt {
        proxy_pass http://miraflores_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /sitemap.xml {
        proxy_pass http://miraflores_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Nest API — gzip JSON for clients with Accept-Encoding (upstream returns plain JSON)
    location /api/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        gzip on;
        gzip_types application/json;
        proxy_pass http://miraflores_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
    }

    # Socket.IO (order-chat namespace) → Nest
    location /socket.io/ {
        proxy_pass http://miraflores_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ^~ — иначе location ~* \.(png|jpg|…) перехватывает /uploads и ищет файлы в Front root → 404
    # alias с диска (не proxy в Nest) — быстрее и без сюрпризов Express
    # Вложения чата — только через подписанный Nest /api/v1/order-chat/files
    location ^~ /uploads/chat/ {
        return 404;
    }

    location ^~ /uploads/ {
        alias /opt/miraflores/backend/.data/local-uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Next Admin + BFF
    location /admin {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ^~ — иначе ~* \.(js|css|…) отдаёт chunks из Vite root → 404 на /admin
    location ^~ /_next/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next BFF: admin login/session/backend proxy (иначе POST → Vite → 405)
    # Длинные таймауты — загрузка видео отзывов через BFF → Nest
    location ^~ /api/admin/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/cdek/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/yandex-delivery {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/yookassa/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # BFF читает X-Forwarded-For первым (IP allowlist ЮKassa)
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Яндекс Пэй Merchant webhook: Callback URL = https://site/api/yandexpay
    location /api/yandexpay/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # JWT body (octet-stream) — не буферизовать агрессивно
        proxy_request_buffering on;
        client_max_body_size 1m;
    }

    # Vite SPA (статика только /assets/ — не ловить /_next/*.js|css)
    root /var/www/miraflores-front;
    index index.html;

    location ^~ /catalog {
        error_page 418 = @seo_bot_prerender;
        if ($seo_bot_prerender) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location ^~ /product/ {
        error_page 418 = @seo_bot_prerender;
        if ($seo_bot_prerender) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location ^~ /articles/ {
        error_page 418 = @seo_bot_prerender;
        if ($seo_bot_prerender) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location = / {
        error_page 418 = @seo_bot_prerender;
        if ($seo_bot_prerender) {
            return 418;
        }
        try_files /index.html =404;
    }

    location @seo_bot_prerender {
        proxy_pass http://miraflores_api/api/v1/seo/bot-html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bot-Request-URI $request_uri;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/ {
        gzip_static on;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
