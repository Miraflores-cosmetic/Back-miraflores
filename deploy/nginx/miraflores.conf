# miraflores-shop.com — wipe cutover (Nest + Next Admin + Vite Front)
# SSL как на текущем VPS: /etc/nginx/ssl/miraflores-shop.com/

upstream miraflores_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Telegram/VK/Facebook не исполняют JS SPA — отдать OG HTML с Nest.
map $http_user_agent $catalog_share_bot {
    default 0;
    ~*facebookexternalhit 1;
    ~*Facebot 1;
    ~*Twitterbot 1;
    ~*TelegramBot 1;
    ~*WhatsApp 1;
    ~*vkShare 1;
    ~*VKBot 1;
    ~*Slackbot 1;
    ~*LinkedInBot 1;
    ~*Pinterest 1;
    ~*Discordbot 1;
}

upstream miraflores_admin {
    server 127.0.0.1:3010;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name miraflores-shop.com www.miraflores-shop.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miraflores-shop.com www.miraflores-shop.com;

    # Видео в отзывах/каталоге — до 80 МБ (Nest multer); запас под multipart-обёртку
    client_max_body_size 100m;

    ssl_certificate     /etc/nginx/ssl/miraflores-shop.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/miraflores-shop.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/miraflores_access.log;
    error_log  /var/log/nginx/miraflores_error.log;

    # Nest API
    location /api/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://miraflores_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # ^~ — иначе location ~* \.(png|jpg|…) перехватывает /uploads и ищет файлы в Front root → 404
    # alias с диска (не proxy в Nest) — быстрее и без сюрпризов Express
    location ^~ /uploads/ {
        alias /opt/miraflores/backend/.data/local-uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Next Admin + BFF
    location /admin {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ^~ — иначе ~* \.(js|css|…) отдаёт chunks из Vite root → 404 на /admin
    location ^~ /_next/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next BFF: admin login/session/backend proxy (иначе POST → Vite → 405)
    # Длинные таймауты — загрузка видео отзывов через BFF → Nest
    location ^~ /api/admin/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/cdek/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/yandex-delivery {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/yookassa/ {
        proxy_pass http://miraflores_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Vite SPA (статика только /assets/ — не ловить /_next/*.js|css)
    root /var/www/miraflores-front;
    index index.html;

    location ^~ /catalog {
        error_page 418 = @catalog_og;
        if ($catalog_share_bot) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @catalog_og {
        proxy_pass http://miraflores_api/api/v1/catalog/open-graph?path=$uri&$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
